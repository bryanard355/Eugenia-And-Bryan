<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugenia Countdown</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="countdown-container">
        <h1>Eugenia & Bryan — Countdown</h1>
        <p>The countdown to finally meeting you starts now!</p>
        <div class="countdown" id="countdown">
            <div class="count-cell">
                <span class="count-num" id="d">00</span>
                <span class="count-label">days</span>
            </div>
            <div class="count-cell">
                <span class="count-num" id="h">00</span>
                <span class="count-label">hours</span>
            </div>
            <div class="count-cell">
                <span class="count-num" id="m">00</span>
                <span class="count-label">min</span>
            </div>
            <div class="count-cell">
                <span class="count-num" id="s">00</span>
                <span class="count-label">sec</span>
            </div>
        </div>
        <p class="meet-date">15th October, 2026</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
